<canvas id="vz" width="300" height="40" style="display:block;margin:12px auto 0;width:min(72vw,300px);height:40px"></canvas><div class="in"><div class="tx"><b style="font-size:24px">${E(s.title)}</b><i style="font-size:15px">${E(s.artist)}</i></div><button id="lk" onclick="like('${s.id}')" aria-label="Curtir">${hrt(s)}</button></div>
<div class="sk"><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Progresso"><div class="tt"><span id="t1">0:00</span><span id="t2">${tm(s.dur)}</span></div></div>
<div class="ct"><button id="bs" onclick="tsf()" aria-label="Aleatório">${ic('shuf')}</button><button onclick="nx(-1)" aria-label="Anterior" style="min-width:48px">${ic('prev',28)}</button><button class="ac" id="pp" onclick="tog()" aria-label="Tocar ou pausar" style="width:72px;height:72px;border-radius:36px"></button><button onclick="nx(1)" aria-label="Próxima" style="min-width:48px">${ic('next',28)}</button><button id="br" onclick="trp()" aria-label="Repetir" style="position:relative"></button></div>
<div class="ly" id="ly"><small>Letra</small>${lyr(s)}</div>
<div class="chips"><button class="chip" onclick="eqs()">Equalizador</button><button class="chip" onclick="qv()">Fila</button></div>`;ctl();ppd()}
$('#pl').addEventListener('input',e=>{if(e.target.id==='sk'&&A.duration)A.currentTime=e.target.value/1000*A.duration});
A.ontimeupdate=()=>{const k=$('#sk');if(k&&A.duration&&document.activeElement!==k){k.value=A.currentTime/A.duration*1000;$('#t1').textContent=tm(A.currentTime);$('#t2').textContent=tm(A.duration)}const ly=$('#ly'),ls=document.querySelectorAll('.lr');if(ly&&ls.length){let a;ls.forEach(x=>{x.style.color='var(--t2)';x.style.fontWeight='';if(+x.dataset.t<=A.currentTime)a=x});if(a){a.style.color='var(--tx)';a.style.fontWeight=600;ly.scrollTop=a.offsetTop-ly.clientHeight/2}}};
A.onplay=A.onpause=ui;A.onended=()=>nx(1,1);
let SH=[];
function sheet(t,items,raw){SH=items.map(x=>x[1]);$('#sc').innerHTML=`<div style="font-size:13px;color:var(--t2);padding:4px 8px 8px">${E(t)}</div>${raw||''}`+items.map((x,i)=>`<button class="sb" onclick="cs();SH[${i}]()">${x[0]}</button>`).join('');$('#sh').classList.add('o')}
const cs=()=>$('#sh').classList.remove('o');
$('#sh').onclick=e=>{if(e.target.id==='sh')cs()};
let RATE=1,LY=null;
const tema=()=>document.documentElement.classList.toggle('lt',load('tema',0)===1);tema();
function cfg(){const lt=load('tema',0)===1;sheet('Ajustes',[[lt?'Tema escuro':'Tema claro',()=>{save('tema',lt?0:1);tema()}],['Velocidade: '+RATE+'x',vel],['Exportar backup (playlists e curtidas)',bak],['Restaurar backup',()=>$('#fb').click()],['Achar músicas duplicadas',dup]])}
function vel(){sheet('Velocidade',[0.75,1,1.25,1.5,2].map(r=>[r+'x'+(r===RATE?' ✓':''),()=>{RATE=r;A.defaultPlaybackRate=r;A.playbackRate=r;toast('Velocidade '+r+'x')}]))}
function bak(){const k=s=>s.artist+'|'+s.title,d=JSON.stringify({pls:pls.map(p=>({name:p.name,keys:p.ids.map(i=>songs.find(s=>s.id===i)).filter(Boolean).map(k)})),liked:songs.filter(s=>s.liked).map(k),plays:Object.fromEntries(songs.map(s=>[k(s),s.plays||0]))}),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='onyx-backup.json';a.click();toast('Backup salvo em Downloads')}
$('#fb').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text()),k=s=>s.artist+'|'+s.title;e.target.value='';pls=(d.pls||[]).map(p=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:p.name,ids:p.keys.map(x=>(songs.find(s=>k(s)===x)||{}).id).filter(Boolean)}));save('pls',pls);for(const s of songs){if((d.liked||[]).includes(k(s)))s.liked=1;if(d.plays&&d.plays[k(s)])s.plays=d.plays[k(s)];await putS(s)}render();toast('Backup restaurado')}catch(x){toast('Arquivo inválido')}};
$('#fl').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!LY)return;LY.lyr=await f.text();await putS(LY);if(lp===LY.id){lp='';ui()}toast('Letra salva');LY=null};
function dup(){const g={};songs.forEach(s=>{const k=nz(s.title)+nz(s.artist);(g[k]=g[k]||[]).push(s)});const d=Object.values(g).filter(a=>a.length>1);if(!d.length)return toast('Nenhuma duplicada');if(confirm(d.length+' música(s) duplicada(s). Apagar as cópias e manter uma de cada?'))d.forEach(a=>a.slice(1).forEach(s=>del(s.id)))}
function qv(){sheet('Fila ('+queue.length+')',queue.map((id,i)=>{const s=songs.find(x=>x.id===id);return[(i===qi?'▶ ':'')+E(s?s.title:'?'),()=>start(i)]}))}
function more(id){const s=songs.find(x=>x.id===id),it=[['Tocar a seguir',()=>{if(qi<0){queue=[id];start(0)}else{queue.splice(qi+1,0,id);toast('Vai tocar a seguir')}}],['Adicionar à playlist',()=>addPl(id)],['Editar informações',()=>{const t=prompt('Título',s.title);if(t===null)return;const a=prompt('Artista',s.artist);if(a===null)return;const b=prompt('Álbum',s.album||'');if(b===null)return;s.title=t.trim()||s.title;s.artist=a.trim()||s.artist;s.album=b.trim();putS(s);render();if(lp===id){lp='';ui()}}],['Importar letra (.lrc ou .txt)',()=>{LY=s;$('#fl').click()}],['Compartilhar música',async()=>{try{const r=await tx('b','readonly',t=>t.objectStore('b').get(id));await navigator.share({files:[new File([r.f],s.title+'.mp3',{type:r.f.type||'audio/mpeg'})]})}catch(e){toast('Não foi possível compartilhar')}}],['Buscar capa e letra',async()=>{toast('Buscando...');await info(s);render();if(lp===id){lp='';ui()}toast(s.cover||s.lyr?'Pronto!':'Nada encontrado (precisa de internet)')}]];
if(st.sub&&st.sub.p)it.push(['Remover desta playlist',()=>{const p=pls.find(x=>x.id===st.sub.p);p.ids=p.ids.filter(x=>x!==id);save('pls',pls);render()}]);
it.push(['Excluir música',()=>{if(confirm('Excluir "'+s.title+'" do app?'))del(id)}]);sheet(s.title,it)}
function addPl(id){const ok=p=>{if(!p.ids.includes(id))p.ids.push(id);save('pls',pls);toast('Adicionada!')};const it=pls.map(p=>[E(p.name),()=>ok(p)]);it.push(['+ Nova playlist',()=>{const p=newPl();if(p)ok(p)}]);sheet('Adicionar à playlist',it)}
async function del(id){await tx(['s','b'],'readwrite',t=>{t.objectStore('s').delete(id);t.objectStore('b').delete(id)});songs=songs.filter(x=>x.id!==id);pls.forEach(p=>p.ids=p.ids.filter(x=>x!==id));save('pls',pls);const pid=queue[qi];queue=queue.filter(x=>x!==id);qi=pid===id?-1:queue.indexOf(pid);if(pid===id){A.pause();A.removeAttribute('src');lp=''}render();ui()}
function mkeq(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();const s=ctx.createMediaElementSource(A);fl=[['lowshelf',200],['peaking',1000],['highshelf',4000]].map(([t,f],i)=>{const b=ctx.createBiquadFilter();b.type=t;b.frequency.value=f;b.gain.value=EQ[i];return b});s.connect(fl[0]);fl[0].connect(fl[1]);fl[1].connect(fl[2]);AN=ctx.createAnalyser();AN.fftSize=64;fl[2].connect(AN);AN.connect(ctx.destination)}catch(e){ctx=null;fl=[]}}
function vz(){const c=$('#vz');if(c&&AN&&!A.paused){const x=c.getContext('2d'),d=new Uint8Array(AN.frequencyBinCount);AN.getByteFrequencyData(d);x.clearRect(0,0,300,40);x.fillStyle='#60A5FA';const w=300/d.length;d.forEach((v,i)=>{const h=v/255*40;x.fillRect(i*w+1,40-h,w-2,h)})}requestAnimationFrame(vz)}vz();
function eqs(){const r=['Graves','Médios','Agudos'].map((n,i)=>`<div style="padding:6px 8px"><div style="font-size:14px">${n}</div><input type="range" min="-12" max="12" value="${EQ[i]}" oninput="seteq(${i},this.value)" aria-label="${n}"></div>`).join('');sheet('Equalizador',[['Zerar',()=>{EQ=[0,0,0];save('eq',EQ);fl.forEach(f=>f.gain.value=0);eqs()}]],r)}
function seteq(i,v){EQ[i]=+v;if(fl[i])fl[i].gain.value=+v;save('eq',EQ)}
function meta(s){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:'Onyx Music'})}catch(e){}}
try{const m=navigator.mediaSession;m.setActionHandler('play',()=>A.play());m.setActionHandler('pause',()=>A.pause());m.setActionHandler('previoustrack',()=>nx(-1));m.setActionHandler('nexttrack',()=>nx(1));m.setActionHandler('seekto',d=>{A.currentTime=d.seekTime})}catch(e){}
(async()=>{try{db=await idb();songs=await tx('s','readonly',t=>t.objectStore('s').getAll())}catch(e){toast('Não foi possível abrir o armazenamento')}render()})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.addEventListener('updatefound',()=>toast('Nova versão! Feche e abra o app.'))).catch(()=>{}));
</script></body></html>
