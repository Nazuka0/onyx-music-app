name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html manifest.json icon.svg www/
      - run: npm install
      - run: npx cap add android
      - run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp launchericon-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp launchericon-512x512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
